name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 1. Integración continua: sintaxis y pruebas unitarias
  pruebas:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring
          tools: composer:v2
          coverage: none

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Revisar la sintaxis de todos los archivos PHP
        run: composer lint

      - name: Ejecutar pruebas unitarias (PHPUnit)
        run: vendor/bin/phpunit --testdox

  # 2. Entrega continua: la imagen se construye y la app responde con MySQL real
  docker:
    name: Build Docker y prueba de humo
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir y levantar los contenedores
        run: docker compose up -d --build --wait

      - name: Verificar que la aplicación y la base de datos responden
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health -o /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"db":true' /tmp/health.json

      - name: Ver los logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar los contenedores
        if: always()
        run: docker compose down -v
